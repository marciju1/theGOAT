<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Instagram Reel...</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #111;
      text-align: center;
    }

    .box {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      padding: 28px 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      line-height: 1.5;
      margin: 10px 0;
    }

    a.button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 20px;
      background: #e1306c;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .small {
      margin-top: 18px;
      font-size: 14px;
      color: #666;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Opening Instagram Reel...</h1>
    <p>We are trying to open a random reel in Instagram.</p>
    <p>If nothing happens, tap the button below.</p>

    <a id="openButton" class="button" href="#" rel="noopener noreferrer">Open in Instagram</a>

    <p class="small" id="chosenText"></p>
  </div>

<script>
  const links = [
    "https://www.instagram.com/reel/DYcp6UxNMeq/",
    "https://www.instagram.com/reel/DVwk9ndgd1a/",
    "https://www.instagram.com/reel/DX_JpiVICw5/",
    "https://www.instagram.com/reel/DWyrWv-DSM0/",
    "https://www.instagram.com/reel/DYhSqC3o0tS/",
    "https://www.instagram.com/reel/DXD20qcIF3K/",
    "https://www.instagram.com/reel/DY8n_Uoz9eN/",
    "https://www.instagram.com/reel/DUBqWykCvgz/",
    "https://www.instagram.com/reel/DX7scqch60R/",
    "https://www.instagram.com/reel/DY5Y7ifJi0d/",
    "https://www.instagram.com/reel/DXW-eyLk8nX/",
    "https://www.instagram.com/reel/DXRpXrYkzV-/",
    "https://www.instagram.com/reel/DWjTMR2k8Oo/",
    "https://www.instagram.com/reel/DYwvlpMTl39/",
    "https://www.instagram.com/reel/DXo9-AdE3IS/",
    "https://www.instagram.com/reel/DXh5s1Gkoch/",
    "https://www.instagram.com/reel/DXe4V7lE8yO/",
    "https://www.instagram.com/reel/DTPsUYfjEHO/",
    "https://www.instagram.com/reel/DYAeQC7yTsK/",
    "https://www.instagram.com/reel/DTI1_PlDIsM/",
    "https://www.instagram.com/reel/DTJGcxxDFP3/",
    "https://www.instagram.com/reel/DUlTgg9goRZ/",
    "https://www.instagram.com/reel/DWf9YEADZHT/",
    "https://www.instagram.com/reel/DXe1oF7Duj5/",
    "https://www.instagram.com/reel/DVMy1mQEkVz/",
    "https://www.instagram.com/reel/DTH6k-Qkgo7/",
    "https://www.instagram.com/reel/DXDexKvgZ5z/",
    "https://www.instagram.com/reel/DX6SfRRpwga/",
    "https://www.instagram.com/reel/DYiNlspgIvU/",
    "https://www.instagram.com/reel/DXaAA4OEZRs/",
    "https://www.instagram.com/reel/DY2e-pGzOIC/"
  ];

  let lastLink = null;
  try {
    lastLink = localStorage.getItem("lastInstagramReel");
  } catch (e) {
    lastLink = null;
  }

  let chosenLink;

  if (links.length === 1) {
    chosenLink = links[0];
  } else {
    do {
      const randomIndex = Math.floor(Math.random() * links.length);
      chosenLink = links[randomIndex];
    } while (chosenLink === lastLink);
  }

  try {
    localStorage.setItem("lastInstagramReel", chosenLink);
  } catch (e) {}

  const openButton = document.getElementById("openButton");
  const chosenText = document.getElementById("chosenText");

  openButton.href = chosenLink;
  chosenText.textContent = "Selected reel: " + chosenLink;

  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /android/i.test(ua);
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

  function toAndroidIntent(url) {
    const cleanUrl = url.replace(/^https?:\/\//, "");
    return "intent://" + cleanUrl + "#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
  }

  function tryOpen() {
    if (isAndroid) {
      window.location.href = toAndroidIntent(chosenLink);
      setTimeout(() => {
        window.location.href = chosenLink;
      }, 1200);
    } else {
      window.location.href = chosenLink;
    }
  }

  setTimeout(tryOpen, 500);
</script>
</body>
</html>
