<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      background: #0a66c2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Opening a random video...</h1>
  <p>If nothing happens, tap the button below.</p>
  <a id="fallbackLink" href="#">Open video</a>

  <script>
    const links = [
      "https://www.instagram.com/reel/DYcp6UxNMeq/?igsh=d21pY3FjbGJ4djNh",
      "https://www.instagram.com/reel/DVwk9ndgd1a/?igsh=MTNuYXJsanF2OXRscA==",
      "https://www.instagram.com/reel/DX_JpiVICw5/?igsh=b3ZsNDVxcmptcjN0",
      "https://www.instagram.com/reel/DXY2608kTpO/?igsh=MXBvdTB0OGRrNnRhcA==",
      "https://www.instagram.com/reel/DWyrWv-DSM0/?igsh=MWdwMDFzYXNhcXJjNQ==",
      "https://www.instagram.com/reel/DYhSqC3o0tS/?igsh=M2Iwb2ptZTFnZDJz",
      "https://www.instagram.com/reel/DXD20qcIF3K/?igsh=MWRzMXhpcHRwN3A1eg==",
      "https://www.instagram.com/reel/DUBqWykCvgz/?igsh=aHY3N2R4aW0wbmVx",
      "https://www.instagram.com/reel/DY2e-pGzOIC/?igsh=MWtubTM3aWh0a3l0bA=="
    ];

    const randomIndex = Math.floor(Math.random() * links.length);
    const chosenLink = links[randomIndex];

    document.getElementById("fallbackLink").href = chosenLink;

    setTimeout(() => {
      window.location.href = chosenLink;
    }, 500);
  </script>
</body>
</html>
